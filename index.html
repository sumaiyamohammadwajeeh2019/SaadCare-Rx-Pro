<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SaadCare MNS Gold FINAL ORIGINAL</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><style>:root{--b:#0b3d91;--g:#c9a227}*{font-family:Arial,sans-serif;box-sizing:border-box}body{background:#eef2f7;padding:10px;margin:0}.p{background:#fff;padding:20px;border-radius:12px;max-width:1050px;margin:auto}.h{display:flex;justify-content:space-between;border-bottom:3px solid var(--b);padding-bottom:12px;align-items:center}.lg{width:120px;height:120px;object-fit:contain;background:#fff}label{font-size:10px;font-weight:700;display:block;margin-top:8px}input,textarea,select{width:100%;padding:8px;border:1.5px solid #cbd5e1;border-radius:6px;font-size:13px;margin-top:3px}.r{display:flex;gap:8px;flex-wrap:wrap}.r>div{flex:1;min-width:120px}.s{background:#eef6ff;border-left:4px solid var(--b);padding:6px 10px;font-weight:700;color:var(--b);margin:15px 0 8px 0;font-size:12px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}table{width:100%;border-collapse:collapse}th{background:#eef6ff;padding:6px;font-size:11px}td{padding:4px}.bt{padding:8px 14px;border:none;border-radius:6px;font-weight:600;cursor:pointer}.bb{background:var(--b);color:#fff}.bg{background:#e2e8f0}.bn{background:#16a34a;color:#fff}.bmi{background:#f0f9ff;border:2px solid #0ea5e9;border-radius:10px;padding:10px;text-align:center}.bmiv{font-size:24px;font-weight:800;color:var(--b)}}</style></head><body><div style="max-width:1050px;margin:0 auto 10px;display:flex;justify-content:space-between"><b style="color:var(--b)">SaadCare MNS Gold FINAL • ORIGINAL LOGO</b><div><button class="bt bg" onclick="exportExcel()">Excel</button> <button class="bt bn" onclick="saveRx()">Save</button> <button class="bt bb" onclick="window.print()">Print</button></div></div><div class="p"><div class="h"><div style="display:flex;gap:14px;align-items:center"><img class="lg" src="logo.png" alt="MNS ORIGINAL"><div><h2 style="margin:0;color:var(--b)">Dr. Mir Nur-Us Saad</h2><p style="margin:4px 0 0;font-size:11px"><b>BCS, MPH, M.Phil</b><br>Public Health Specialist<br><span style="background:var(--b);color:#fff;padding:2px 10px;border-radius:12px;font-size:9px">MNS Gold • ORIGINAL LOGO</span></p></div></div><div style="text-align:right;font-size:11px"><b style="color:var(--b)">Shurokkha Diagnostic</b><br>Kishoreganj<br><b>01711179468</b><div id="qrcode" style="margin-top:8px"></div></div></div><div class="s">Patient Info</div><div class="r"><div><label>Name *</label><input id="pName" oninput="genQR()"></div><div><label>Age</label><input id="pAge"></div><div><label>Sex</label><select id="pSex"><option>Male</option><option>Female</option></select></div><div><label>Date</label><input type="date" id="pDate"></div></div><div class="s">BMI AUTO</div><div class="g4"><div><label>Weight kg *</label><input id="exWt" type="number" oninput="calcBMI()" style="border-color:green;font-weight:700"></div><div><label>Height cm *</label><input id="exHtCm" type="number" oninput="calcBMI()" style="border-color:green"></div><div><label>Height ft</label><input id="exHt" placeholder="5'6" oninput="calcBMIft()"></div><div><div class="bmi"><div id="bmiDisplay" class="bmiv">--</div><div id="bmiStatus" style="font-size:11px;background:#e2e8f0;padding:4px 10px;border-radius:12px">Enter Wt & Ht</div><input id="exBmi" type="hidden"></div></div></div><div class="s">Rx</div><table id="medTable"><tr><th>Medicine</th><th>Dose</th><th>Days</th><th></th></tr><tr><td><input list="meds" placeholder="Napa / Seclo"></td><td><input placeholder="1+0+1"></td><td><input placeholder="7d"></td><td><button onclick="this.parentNode.parentNode.remove()">X</button></td></tr></table><button class="bt bg" style="margin-top:8px" onclick="addRow()">+ Add Medicine</button></div><datalist id="meds"><option value="Napa 500mg"><option value="Seclo 20mg"><option value="Losartan 50mg"></datalist><script>document.getElementById('pDate').valueAsDate=new Date();let qrcode=new QRCode(document.getElementById("qrcode"),{width:75,height:75});function genQR(){let t=document.getElementById('pName').value||'Patient';qrcode.clear();qrcode.makeCode(t+" BMI:"+document.getElementById('exBmi').value);}genQR();function addRow(){let t=document.getElementById('medTable');let r=t.insertRow(-1);r.innerHTML='<td><input list="meds"></td><td><input></td><td><input></td><td><button onclick="this.parentNode.parentNode.remove()">X</button></td>';}function calcBMI(){let w=parseFloat(document.getElementById('exWt').value);let hCm=parseFloat(document.getElementById('exHtCm').value);let b=document.getElementById('bmiDisplay');let s=document.getElementById('bmiStatus');if(w>0&&hCm>0){let h=hCm/100;let bmi=(w/(h*h)).toFixed(1);document.getElementById('exBmi').value=bmi;b.textContent=bmi;if(bmi<18.5)s.textContent='Underweight';else if(bmi<25){s.textContent='Normal ✅';s.style.background='#22c55e';s.style.color='#fff';}else if(bmi<30)s.textContent='Overweight';else s.textContent='Obese';genQR();}else{b.textContent='--';}}function calcBMIft(){let ft=document.getElementById('exHt').value;if(!ft.includes("'"))return;let p=ft.split("'");let cm=parseFloat(p[0])*30.48+parseFloat(p[1]||0)*2.54;if(cm>50){document.getElementById('exHtCm').value=cm.toFixed(1);calcBMI();}}function saveRx(){let d={name:document.getElementById('pName').value};if(!d.name){alert('Name required');return;}let db=JSON.parse(localStorage.getItem('saadcare_db')||'[]');db.unshift(d);localStorage.setItem('saadcare_db',JSON.stringify(db));alert('Saved');}function exportExcel(){let db=JSON.parse(localStorage.getItem('saadcare_db')||'[]');if(db.length==0){alert('No data');return;}let ws=XLSX.utils.json_to_sheet(db);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Patients");XLSX.writeFile(wb,"SaadCare_MNS_FINAL.xlsx");}</script></body></html>
